{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#09090c">
    <meta name="description" content="{{ book_title }} – {{ book_subtitle }}">
    <title>FOR MY LOVE</title>

    <link rel="preload" href="{% static 'book/fonts/cinzel-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" as="image" href="{% static 'book/img/pages/1.jpg' %}">
    <link rel="stylesheet" href="{% static 'book/css/book.css' %}">
    <script src="{% static 'book/js/page-flip.browser.js' %}" defer></script>
    <script src="{% static 'book/js/book.js' %}" defer></script>
</head>
<body>
<div class="ambient-light"></div>

<!-- START SCREEN -->
<div id="startup-screen">
    <h1 class="font-cinzel title">{{ book_title }}</h1>
    <p class="subtitle">{{ book_subtitle }}</p>
    <button id="start-btn" class="glass-btn start-btn font-cinzel" type="button">
        <span>OPEN BOOK</span>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/></svg>
    </button>
</div>

<!-- UI -->
<div id="ui-layer">
    <div class="top-bar">
        <div id="music-indicator" class="music-box hidden-ui">
            <div class="music-bars" id="music-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
            <span id="song-title" class="song-title">Playing…</span>
            <button id="toggle-pause" type="button" class="icon-btn" aria-label="Pause music">
                <svg id="ico-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                <svg id="ico-play" class="hide" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.85l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>
            </button>
            <button id="toggle-mute" type="button" class="icon-btn" aria-label="Mute">
                <svg id="ico-vol" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                <svg id="ico-mute" class="hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="m22 9-6 6M16 9l6 6"/></svg>
            </button>
        </div>
        <div class="page-box font-cinzel"><span id="page-counter">Cover</span></div>
    </div>

    <div class="nav-buttons">
        <button id="prev-btn" class="nav-btn" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
        <button id="next-btn" class="nav-btn" type="button" aria-label="Next page"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>

    <div class="bottom-text">SWIPE TO TURN PAGES</div>
</div>

<!-- BOOK -->
<div class="floating-container" id="main-content">
    <div class="book-wrapper"><div id="book">
        {% for pg in pages %}{% with n=pg.n %}
        <div class="page{% if forloop.first or forloop.last %} --hard{% endif %}">
            <div class="page-content">
                <img class="page-image" alt="Page {{ n }}" draggable="false" width="530" height="770" decoding="async"
                     {% if n <= 4 %}src="{{ pg.url }}"{% else %}data-src="{{ pg.url }}"{% endif %}>
            </div>
        </div>
        {% endwith %}{% endfor %}
    </div></div>
</div>

<!-- Ad-free player: plain HTML5 audio (used whenever a song has an audio file/URL) -->
<audio id="song-audio" preload="none" playsinline loop></audio>
<!-- YouTube fallback container (only loaded if a page has no audio file) -->
<div id="yt-player-container" aria-hidden="true"></div>

{{ songs|json_script:"songs-data" }}
<div id="book-config" data-total="{{ total_pages }}" data-flip-sound="{% static 'book/audio/page-turn.mp3' %}" hidden></div>
</body>
</html>
